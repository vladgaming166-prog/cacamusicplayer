plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cacamusicplayer.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.cacamusicplayer.app"
        minSdk 14
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            // Default debug keystore is generated by the Android plugin.
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ""
        }
        release {
            // Beginners can install a release APK without creating a keystore.
            // Replace this with your own signingConfig for Play Store uploads.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "CacaMusicPlayer.apk"
        }
    }
}

dependencies {
    // No third-party libraries. Framework APIs only, for old-device compatibility.
}
