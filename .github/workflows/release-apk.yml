name: Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CacaMusicPlayer release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK platform 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "Using Android SDK at $SDK"
          SM=""
          for candidate in \
              "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
              "$SDK/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SM="$candidate"
              break
            fi
          done
          if [ -z "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "sdkmanager not found"
            ls -la "$SDK" || true
            exit 1
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload CacaMusicPlayer-release.zip
        uses: actions/upload-artifact@v4
        with:
          name: CacaMusicPlayer-release
          path: app/build/outputs/apk/release/CacaMusicPlayer.apk
          if-no-files-found: error
          retention-days: 30
