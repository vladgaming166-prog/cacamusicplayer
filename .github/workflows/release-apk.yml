name: Release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CacaMusicPlayer release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release folder
        run: |
          mkdir -p dist
          test -f app/build/outputs/apk/release/CacaMusicPlayer.apk
          cp app/build/outputs/apk/release/CacaMusicPlayer.apk dist/CacaMusicPlayer.apk
          ls -lh dist/CacaMusicPlayer.apk

      # Uploading the APK lets GitHub Actions give you one zip:
      # CacaMusicPlayer-release.zip  →  CacaMusicPlayer.apk
      - name: Upload CacaMusicPlayer-release.zip
        uses: actions/upload-artifact@v4
        with:
          name: CacaMusicPlayer-release
          path: dist/CacaMusicPlayer.apk
          if-no-files-found: error
          retention-days: 30
